<!-- Bootstrap 5 CSS & Icons placed first so custom styling overrides with higher priority -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
  /* ── Google Fonts: Plus Jakarta Sans & JetBrains Mono ── */
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

  /* ============================================================ */
  /* DESIGN TOKENS — WARM MINIMALIST / NOVAPAY THEME              */
  /* (Cream & Espresso & Tangerine Edition)                       */
  /* ============================================================ */
  :root {
    /* Brand Accent Colors */
    --primary: #e26237;
    --primary-hover: #d25329;
    --primary-active: #bf471f;
    --primary-gradient: linear-gradient(135deg, #ff7a3d 0%, #e25822 100%);
    --primary-glow: rgba(226, 98, 55, 0.35);

    /* Backgrounds & Surfaces */
    --bg-outer: #462a19;              /* Deep Warm Coffee / Espresso outside shell */
    --bg-outer-dark: #3a2213;
    --bg-canvas: #f6f0eb;             /* Warm Cream / Milk Tea container */
    --bg-canvas-subtle: #efe7e0;
    --surface-card: #ffffff;          /* Pure White Cards */
    --surface-subcard: #faf6f2;
    --surface-peach: #fdece2;         /* Soft Peach / Bisque for badges & promo */
    --surface-peach-border: #f8dcd0;
    --surface-chocolate: #6b3b1e;     /* Deep Mocha Card for Goal */
    --surface-chocolate-dark: #582e14;

    /* Dark Espresso Tones */
    --espresso-dark: #331f14;         /* Headings & Main Values */
    --espresso-main: #3d2416;
    --espresso-btn: #3d2214;          /* Dark Chocolate Buttons */
    --espresso-btn-hover: #2c170d;
    --text-muted-warm: #8c7a6e;       /* Secondary / Subtitles */
    --text-subtle: #aa9c92;

    /* Status Colors */
    --success: #22c55e;
    --success-light: #ecfdf5;
    --warning: #f59e0b;
    --danger: #ef4444;

    /* Radii */
    --radius-shell: 34px;
    --radius-card: 22px;
    --radius-stat: 18px;
    --radius-pill: 9999px;
    --radius-sm: 10px;

    /* Shadows */
    --shadow-shell: 0 25px 70px rgba(28, 14, 7, 0.45);
    --shadow-card: 0 4px 18px rgba(74, 46, 27, 0.04), 0 1px 3px rgba(74, 46, 27, 0.02);
    --shadow-card-hover: 0 10px 28px rgba(74, 46, 27, 0.08);
    --shadow-orange: 0 10px 25px rgba(226, 98, 55, 0.35);
  }

  /* ── Reset & Baseline ── */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-outer) !important;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(95, 58, 35, 0.6) 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(70, 42, 25, 0.8) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(80, 48, 29, 0.4) 0%, transparent 60%);
    color: var(--espresso-dark) !important;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    letter-spacing: -0.012em;
    overflow-x: hidden;
  }

  h1, h2, h3, h4, h5, h6 {
    color: var(--espresso-dark) !important;
    font-weight: 800;
    letter-spacing: -0.025em;
  }

  /* Monospace Font for Numbers & Financials */
  .font-mono-num {
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.025em;
  }

  /* SPA Transitions */
  .spa-view {
    animation: fadeInView 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeInView {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #d8cec4;
    border-radius: var(--radius-pill);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
  }

  /* ============================================================ */
  /* MAIN SHELL CONTAINER (The Rounded Cream Board in Screenshot) */
  /* ============================================================ */
  .app-shell-container {
    max-width: 1420px;
    margin: 0 auto;
    background: var(--bg-canvas);
    border-radius: var(--radius-shell);
    box-shadow: var(--shadow-shell);
    display: flex;
    min-height: calc(100vh - 40px);
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  /* ── 1. Left Sidebar (Crisp White Card Look) ── */
  .app-sidebar {
    width: 240px;
    background: var(--surface-card);
    padding: 32px 20px 24px 24px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-right: 1px solid rgba(74, 46, 27, 0.05);
    z-index: 1040;
  }

  .sidebar-brand {
    padding: 0 8px 24px 8px;
    display: flex;
    align-items: center;
  }
  .brand-logo-text {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--espresso-dark);
    letter-spacing: -0.035em;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .brand-logo-accent {
    color: var(--primary);
  }
  .brand-pos-pill {
    background: var(--surface-peach);
    color: var(--primary);
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    margin-left: 6px;
    letter-spacing: 0.04em;
  }

  /* Sidebar Links */
  .sidebar-nav-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .sidebar-group-title {
    font-size: 0.68rem;
    font-weight: 800;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 10px 12px 4px 12px;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-pill);
    color: var(--text-muted-warm);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.16s ease;
    cursor: pointer;
  }
  .sidebar-link:hover {
    color: var(--espresso-dark);
    background: rgba(74, 46, 27, 0.04);
  }
  .sidebar-link.active {
    color: var(--espresso-dark);
    font-weight: 800;
    background: rgba(74, 46, 27, 0.06);
  }
  .sidebar-link.active .link-icon-box {
    color: var(--primary);
  }
  .sidebar-link .link-icon-box {
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    color: var(--text-muted-warm);
    transition: color 0.16s ease;
  }
  .sidebar-pill-badge {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--espresso-dark);
    background: rgba(74, 46, 27, 0.07);
    border-radius: var(--radius-pill);
    padding: 2px 8px;
    font-family: 'JetBrains Mono', monospace;
  }
  .sidebar-pill-badge.badge-live {
    background: var(--surface-peach);
    color: var(--primary);
    font-weight: 800;
  }

  /* Sidebar Promo Upgrade Card (Matching NovaPay Screenshot) */
  .sidebar-pro-card {
    background: var(--surface-peach);
    border: 1px solid var(--surface-peach-border);
    border-radius: var(--radius-card);
    padding: 18px 16px;
    margin-top: 24px;
    text-align: center;
  }
  .pro-title {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--espresso-dark);
    margin-bottom: 4px;
  }
  .btn-pro-action {
    background: var(--espresso-btn);
    border: none;
    color: #ffffff;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 0 4px 12px rgba(61, 34, 20, 0.25);
    margin-top: 10px;
    display: inline-block;
    width: 100%;
  }
  .btn-pro-action:hover {
    background: var(--espresso-btn-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(61, 34, 20, 0.35);
  }

  /* ── 2. Main Content Canvas ── */
  .app-main-area {
    flex: 1;
    background: var(--bg-canvas);
    padding: 30px 36px 36px 36px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    max-height: calc(100vh - 40px);
  }

  /* ── 3. Topbar Header ── */
  .app-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }
  .topbar-greeting {
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--text-muted-warm);
    margin-bottom: 2px;
  }
  .topbar-title {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--espresso-dark);
    margin: 0;
    letter-spacing: -0.03em;
  }

  /* Topbar Right Controls */
  .topbar-right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-search-pill {
    background: var(--surface-card);
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-card);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 220px;
    border: 1px solid rgba(74, 46, 27, 0.04);
  }
  .topbar-search-pill input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 0.84rem;
    width: 100%;
    color: var(--espresso-dark);
  }
  .topbar-search-pill input::placeholder {
    color: var(--text-subtle);
  }
  .topbar-search-pill .search-icon {
    color: var(--text-subtle);
    font-size: 0.88rem;
  }

  .topbar-icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-card);
    border: 1px solid rgba(74, 46, 27, 0.05);
    box-shadow: var(--shadow-card);
    color: var(--espresso-dark);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }
  .topbar-icon-btn:hover {
    background: var(--surface-subcard);
    transform: translateY(-1px);
  }
  .topbar-dot-indicator {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--primary);
  }
  .topbar-user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-peach);
    color: var(--primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    box-shadow: 0 2px 8px rgba(74, 46, 27, 0.08);
    border: 1.5px solid var(--surface-peach-border);
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .topbar-user-avatar:hover {
    transform: translateY(-1px);
    background: #fbdac9;
    border-color: var(--primary);
  }

  /* ============================================================ */
  /* CARDS & CONTAINERS (Crisp White with Soft Warm Corners)      */
  /* ============================================================ */
  .card-novapay {
    background: var(--surface-card) !important;
    border-radius: var(--radius-card) !important;
    border: 1px solid rgba(74, 46, 27, 0.04) !important;
    box-shadow: var(--shadow-card) !important;
    padding: 22px 24px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card-novapay:hover {
    box-shadow: var(--shadow-card-hover) !important;
  }

  /* ── 1. Top 3 Stat Cards (Card Transfers, External, Internal) ── */
  .stat-card-novapay {
    background: var(--surface-card);
    border-radius: var(--radius-stat);
    border: 1px solid rgba(74, 46, 27, 0.04);
    box-shadow: var(--shadow-card);
    padding: 18px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .stat-badge-peach {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--surface-peach);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    margin-bottom: 12px;
  }
  .stat-label-novapay {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted-warm);
    margin-bottom: 4px;
  }
  .stat-val-novapay {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--espresso-dark);
    line-height: 1.1;
  }

  /* ── 2. Smart Banking Banner Card with Floating Tangerine Card ── */
  .smart-pos-banner-card {
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(74, 46, 27, 0.04);
    padding: 28px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .smart-pos-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--espresso-dark);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .smart-pos-desc {
    font-size: 0.82rem;
    color: var(--text-muted-warm);
    max-width: 320px;
    margin-bottom: 18px;
    line-height: 1.45;
  }
  .btn-espresso-pill {
    background: var(--espresso-btn) !important;
    color: #ffffff !important;
    font-size: 0.84rem;
    font-weight: 700;
    padding: 9px 24px;
    border-radius: var(--radius-pill) !important;
    border: none;
    cursor: pointer;
    transition: all 0.18s ease;
    box-shadow: 0 4px 14px rgba(61, 34, 20, 0.25);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-espresso-pill:hover {
    background: var(--espresso-btn-hover) !important;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(61, 34, 20, 0.35);
  }

  /* Floating 3D Tangerine Credit Card */
  .floating-tangerine-card {
    width: 250px;
    height: 145px;
    border-radius: 18px;
    background: var(--primary-gradient);
    box-shadow: 0 16px 36px rgba(226, 98, 55, 0.38), 0 2px 6px rgba(226, 98, 55, 0.2);
    padding: 16px 18px;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    flex-shrink: 0;
    transform: rotate(-1deg);
    transition: transform 0.25s ease;
  }
  .floating-tangerine-card:hover {
    transform: rotate(0deg) translateY(-3px);
  }
  .tangerine-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    opacity: 0.95;
  }
  .tangerine-card-chip {
    width: 26px;
    height: 18px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.3);
    display: inline-block;
  }
  .tangerine-card-number {
    font-size: 0.98rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }
  .tangerine-card-footer {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    font-weight: 700;
  }

  /* ── 3. Monthly Savings Card (Spline Line Chart) ── */
  .monthly-savings-card {
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(74, 46, 27, 0.04);
    padding: 24px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .savings-card-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted-warm);
    margin-bottom: 4px;
  }
  .savings-card-amount {
    font-size: 2.05rem;
    font-weight: 800;
    color: var(--espresso-dark);
    margin-bottom: 12px;
    letter-spacing: -0.03em;
  }
  .savings-period-tabs {
    display: flex;
    gap: 14px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-subtle);
    margin-bottom: 16px;
  }
  .savings-period-tab {
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .savings-period-tab.active {
    color: var(--espresso-dark);
  }

  /* Spline Chart SVG Box */
  .spline-chart-wrap {
    position: relative;
    width: 100%;
    margin-top: 10px;
  }
  .chart-month-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-subtle);
    margin-top: 6px;
    padding: 0 4px;
  }
  .active-month-pill {
    background: var(--primary);
    color: #ffffff;
    padding: 1px 7px;
    border-radius: var(--radius-pill);
    box-shadow: 0 2px 6px rgba(226, 98, 55, 0.35);
  }

  /* ── 4. Bottom 3 Cards: Recent Transactions, Recent Transfers, Savings Goal ── */
  .recent-mini-card {
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(74, 46, 27, 0.04);
    padding: 22px;
    height: 100%;
  }
  .mini-card-title {
    font-size: 0.98rem;
    font-weight: 800;
    color: var(--espresso-dark);
    margin-bottom: 16px;
  }
  .mini-tx-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
  }
  .tx-icon-peach {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface-peach);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .tx-avatar-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--surface-peach);
    color: var(--primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .tx-name {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--espresso-dark);
  }
  .tx-time {
    font-size: 0.72rem;
    color: var(--text-subtle);
  }
  .tx-amount-neg {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--espresso-dark);
    font-family: 'JetBrains Mono', monospace;
  }
  .tx-amount-pos {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--primary);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── 5. Savings Goal (Deep Mocha Brown Card in Screenshot) ── */
  .savings-goal-mocha-card {
    background: var(--surface-chocolate) !important;
    background: linear-gradient(135deg, #6b3b1e 0%, #4a2713 100%) !important;
    border-radius: var(--radius-card);
    box-shadow: 0 10px 30px rgba(74, 46, 27, 0.25);
    padding: 24px 22px;
    color: #ffffff;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .goal-title-small {
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 2px;
  }
  .goal-name-big {
    font-size: 1.15rem;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }
  .goal-amount-range {
    font-size: 0.76rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .goal-progress-bar {
    height: 5px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-pill);
    overflow: hidden;
    width: 140px;
  }
  .goal-progress-fill {
    height: 100%;
    background: #ffffff;
    border-radius: var(--radius-pill);
    width: 82%;
  }

  /* Circular Donut Gauge (82%) */
  .donut-gauge-box {
    width: 82px;
    height: 82px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .donut-gauge-text {
    position: absolute;
    font-size: 0.95rem;
    font-weight: 800;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ============================================================ */
  /* ACTIVITIES / EVENTS TABLE (Matching Warm Theme)              */
  /* ============================================================ */
  .table-novapay {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .table-novapay thead th {
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--text-muted-warm);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(74, 46, 27, 0.08);
  }
  .table-novapay tbody td {
    padding: 14px 18px;
    vertical-align: middle;
    border-bottom: 1px solid rgba(74, 46, 27, 0.05);
    color: var(--espresso-dark);
  }
