<!-- Toast Notification Component -->
<div class="toast-container">
  <div id="mainToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body fw-semibold" id="toastMessage">Pesan</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script>
  function showToast(message, type) {
    type = type || 'primary';
    var toast   = document.getElementById('mainToast');
    var msgEl   = document.getElementById('toastMessage');
    msgEl.textContent = message;
    toast.className   = 'toast align-items-center border-0 text-white bg-' + type;
    var bsToast = new bootstrap.Toast(toast, { delay: 3000 });
    bsToast.show();
  }
</script>
